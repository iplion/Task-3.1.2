server:
  port: 8081
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/itm-db
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: create
    show_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
