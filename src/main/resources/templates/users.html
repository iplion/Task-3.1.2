<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <title>Cars list</title>
    <style>
        table {
            font-family: Arial, sans-serif;
            width: 100%;
            border-collapse: collapse;
            background-color: lightcoral;
            text-align: left;
        }
        th, td {
            border: 1px solid red;
        }
    </style>
</head>
<body>
<a th:href="@{/logout}">Logout here</a><br/>

<div>
    <table>
        <tr>
            <td>name</td>
            <td>nickname</td>
            <td>hair color</td>
            <td>must die?</td>
            <td>i can...</td>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.nickname}"></td>
            <td th:text="${user.hairColor}"></td>
            <td th:text="${user.isMustDie}"></td>
            <td>
                <a th:href="@{/admin/users/edit/{id}(id=${user.uuid})}">... edit him/her/it!</a> |
                <form th:action="@{/admin/users/{uuid}(uuid=${user.uuid})}" method="post" onsubmit="return confirm('Do you really want to erase this plebeian?');">
                    <input type="hidden" name="_method" value="delete">
                    <button type="submit">... ERASE this!!!</button>
                </form>
            </td>
        </tr>
    </table>
    <a th:href="@{/admin/users/edit}">Create new plebeian</a>
</div>
</body>
</html>
